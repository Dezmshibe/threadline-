{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in · {{ store_name }}{% endblock %}
{% block content %}
<div class="container section narrow">
  <h1 class="h2">Log in</h1>
  {% if error %}<p class="flash error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    {{ csrf() }}
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <label class="radio-row"><input type="checkbox" name="remember"> <span>Keep me logged in</span></label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
